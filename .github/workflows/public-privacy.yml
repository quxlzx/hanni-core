name: Public privacy gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current source and reachable history without printing matched values
        run: python scripts/audit_public_release.py --history --report data/public-release/ci-audit.json
