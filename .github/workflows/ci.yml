name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check shipped frontend
        run: |
          npm ci --prefix frontend
          node --test frontend/tests/*.test.ts frontend/tests/*.test.mjs
          npm run build --prefix frontend
          git diff --exit-code -- src/hanni/dashboard/static

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux audio dependency
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then VENVBIN=.venv/Scripts; else VENVBIN=.venv/bin; fi
          "$VENVBIN/python" -m pip install --upgrade pip
          "$VENVBIN/python" -m pip install -e ".[dev,ui-test,teams]"

      - name: Set up Node for frontend source-audit tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install shipped frontend dependencies
        run: npm ci --prefix frontend

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then VENVBIN=.venv/Scripts; else VENVBIN=.venv/bin; fi
          "$VENVBIN/python" scripts/test_assistant_harness.py --coverage --output .pytest-work/assistant-harness/ci

      - name: Retain assistant harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-harness-${{ matrix.os }}-${{ matrix.python-version }}
          path: .pytest-work/assistant-harness/ci
          include-hidden-files: true

  build:
    runs-on: windows-latest
    needs: [tests, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python scripts/check_distribution.py
