name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check shipped frontend
        run: |
          npm ci --prefix frontend
          node --test frontend/tests/*.test.ts frontend/tests/*.test.mjs
          npm run build --prefix frontend
          git diff --exit-code -- src/hanni/dashboard/static

  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -e ".[dev,ui-test]"

      - name: Run tests
        run: .venv/Scripts/python.exe scripts/test_assistant_harness.py --coverage --output .pytest-work/assistant-harness/ci

      - name: Retain assistant harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-harness-${{ matrix.python-version }}
          path: .pytest-work/assistant-harness/ci
          include-hidden-files: true

  build:
    runs-on: windows-latest
    needs: [tests, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python scripts/check_distribution.py
